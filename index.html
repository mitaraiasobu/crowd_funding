<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寿命支援 | 御手洗 遊</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5d0e8 0%, #e9d5f5 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      max-width: 480px;
      width: 90%;
    }
    .emoji { font-size: 56px; margin-bottom: 20px; }
    .message {
      font-size: 22px;
      font-weight: 800;
      color: #6b21a8;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .countdown {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 20px;
    }
    .countdown span {
      font-weight: 700;
      color: #ec4899;
      font-size: 18px;
    }
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #9333ea, #ec4899);
      color: white;
      border-radius: 999px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(147,51,234,0.35);
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.92; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🦝</div>
    <div class="message">ここは古いので、<br>新しいサイトへごあんな～い🤍</div>
    <div class="countdown"><span id="sec">5</span> 秒後に自動で移動します</div>
    <a class="btn" href="https://mitaraiasobu.github.io/Asobu-Archive/#crowdfunding">今すぐ移動する →</a>
  </div>

  <script>
    const dest = "https://mitaraiasobu.github.io/Asobu-Archive/#crowdfunding";
    let n = 5;
    const el = document.getElementById("sec");
    const timer = setInterval(() => {
      n--;
      el.textContent = n;
      if (n <= 0) {
        clearInterval(timer);
        location.replace(dest);
      }
    }, 1000);
  </script>
</body>
</html>
